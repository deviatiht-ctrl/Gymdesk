name: gym_desk
description: Gestion multi-salles de sport, locale en priorité.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  go_router: 18.0.1
  drift: 2.35.0
  drift_flutter: 0.3.1
  supabase_flutter: 2.17.2
  connectivity_plus: 7.3.1
  flutter_secure_storage: 11.2.0
  cryptography: 2.7.0
  image_picker: 1.2.0
  image: 4.9.2
  google_fonts: 8.2.1
  shimmer: 4.0.0
  lucide_icons_flutter: 3.1.20
  uuid: 4.6.0
  timezone: 0.11.1
  intl: 0.20.3
  qr_flutter: 4.1.0
  mobile_scanner: 7.1.3
  pdf: 3.13.1
  printing: 5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: 4.0.9
  drift_dev: 2.35.0
  build_runner: 2.16.1
  flutter_lints: 6.0.0

dependency_overrides:
  analyzer: 14.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
