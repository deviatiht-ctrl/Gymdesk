  <script>
    // --- Espace membre : installation PWA par gym (logo + nom du gym) ---
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
      window.addEventListener('appinstalled', function () { deferred = null; });
      window.securgymCanInstall = function () { return deferred !== null; };
      window.securgymPromptInstall = function () {
        if (!deferred) return Promise.resolve('unavailable');
        var d = deferred; deferred = null;
        d.prompt();
        return d.userChoice.then(function (c) { return c && c.outcome ? c.outcome : 'dismissed'; })
          .catch(function () { return 'dismissed'; });
      };
      window.securgymIsStandalone = function () {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      };
      window.securgymIsIOS = function () {
        return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      };

      var manifestBlob = null;
      function applyManifest(name, startPath, icons, color) {
        var origin = location.origin;
        var m = {
          id: startPath, name: name, short_name: name.length > 14 ? name.substring(0, 14) : name,
          start_url: origin + startPath, scope: origin + '/', display: 'standalone',
          background_color: '#0B1220', theme_color: color || '#0F766E', orientation: 'portrait',
          description: name + ' — Espace membre', icons: icons
        };
        if (manifestBlob) URL.revokeObjectURL(manifestBlob);
        manifestBlob = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
        document.getElementById('securgym-manifest').setAttribute('href', manifestBlob);
        document.getElementById('securgym-theme').setAttribute('content', color || '#0F766E');
        var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (t) t.setAttribute('content', m.short_name);
      }
      function defaultIcons() {
        var o = location.origin;
        return [
          { src: o + '/icons/Icon-192.png', sizes: '192x192', type: 'image/png' },
          { src: o + '/icons/Icon-512.png', sizes: '512x512', type: 'image/png' },
          { src: o + '/icons/Icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ];
      }
      // Logo du gym redessiné en carré PNG 192/512 (exigence d'installation Android/iOS).
      function squareIcon(img, size, bg) {
        var c = document.createElement('canvas'); c.width = size; c.height = size;
        var g = c.getContext('2d');
        g.fillStyle = bg; g.fillRect(0, 0, size, size);
        var pad = size * 0.12, box = size - pad * 2;
        var r = Math.min(box / img.naturalWidth, box / img.naturalHeight);
        var w = img.naturalWidth * r, h = img.naturalHeight * r;
        g.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        return c.toDataURL('image/png');
      }
      window.securgymSetManifest = function (name, startPath, iconUrl, color) {
        applyManifest(name, startPath, defaultIcons(), color);
        if (!iconUrl) return;
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
          try {
            var i512 = squareIcon(img, 512, '#FFFFFF'), i192 = squareIcon(img, 192, '#FFFFFF');
            applyManifest(name, startPath, [
              { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
              { src: i512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ], color);
            var link = document.querySelector('link[rel="apple-touch-icon"]');
            if (link) link.setAttribute('href', squareIcon(img, 180, '#FFFFFF'));
          } catch (e) { /* image non CORS : icônes par défaut */ }
        };
        img.src = iconUrl;
      };
      // Ouverture directe sur /m/<gym> : manifest du gym dès le chargement.
      var mm = location.pathname.match(/^\/m\/([0-9a-fA-F-]{36})/);
      if (mm) applyManifest('Espace membre', '/m/' + mm[1], defaultIcons(), '#0F766E');
    })();

    // --- Contrôle d'accès : 2e écran dans une vraie fenêtre séparée, temps réel ---
    (function () {
      var post = null;
      var BRIDGE_KEY = 'securgym_access_bridge_msg';
      var listeners = [];
      var storageBound = false;
      function dispatch(raw) {
        for (var i = 0; i < listeners.length; i++) {
          try { listeners[i](raw); } catch (e) {}
        }
      }
      function bindStorage() {
        if (storageBound) return;
        storageBound = true;
        window.addEventListener('storage', function (ev) {
          if (ev.key !== BRIDGE_KEY || !ev.newValue) return;
          try {
            var parsed = JSON.parse(ev.newValue);
            if (parsed && parsed.payload) dispatch(String(parsed.payload));
          } catch (e) {}
        });
      }
      window.securgymBridgePost = function (msg) {
        try {
          if (!post && 'BroadcastChannel' in window) post = new BroadcastChannel('securgym-access-display');
          if (post) post.postMessage(msg);
        } catch (e) {}
        try {
          localStorage.setItem(BRIDGE_KEY, JSON.stringify({ ts: Date.now(), nonce: Math.random(), payload: String(msg) }));
        } catch (e) {}
      };
      window.securgymBridgeListen = function (cb) {
        if (typeof cb === 'function') listeners.push(cb);
        bindStorage();
        var ok = true;
        try {
          if ('BroadcastChannel' in window) {
            var ch = new BroadcastChannel('securgym-access-display');
            ch.onmessage = function (e) { cb(String(e.data)); };
          }
        } catch (e) { ok = false; }
        return ok || ('localStorage' in window);
      };
      window.securgymOpenWindow = function (url, name) {
        var w = window.open(url, name, 'popup=yes,width=1280,height=800,left=60,top=40');
        if (!w) return false;
        try { w.focus(); } catch (e) {}
        // Écran secondaire détecté (Chrome/Edge) : la fenêtre s'y place en plein écran.
        if ('getScreenDetails' in window) {
          window.getScreenDetails().then(function (d) {
            var s = d.screens.filter(function (x) { return x !== d.currentScreen; })[0];
            if (s && !w.closed) { w.moveTo(s.availLeft, s.availTop); w.resizeTo(s.availWidth, s.availHeight); }
          }).catch(function () {});
        }
        return true;
      };
      window.securgymCloseWindow = function () { try { window.close(); } catch (e) {} };
    })();
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B1220;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #securgym-splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 30%, #132238 0%, #0B1220 70%, #060A12 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #securgym-splash-screen.fade-out {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }
        .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 420px;
    }
    .splash-logo-container {
      position: relative;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-glow {
      position: absolute;
      width: 280px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(15, 118, 110, 0.45) 0%, rgba(15, 118, 110, 0) 70%);
      animation: pulse-glow 2.4s infinite ease-in-out;
      filter: blur(12px);
      pointer-events: none;
    }
    .splash-logo-img {
      position: relative;
      z-index: 2;
      max-width: 280px;
      width: 82vw;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.5));
    }
    .splash-progress-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .splash-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #0F766E, #14B8A6, #2DD4BF);
      border-radius: 999px;
      animation: indeterminate 1.3s infinite cubic-bezier(0.65, 0.815, 0.735, 0.395);
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.6);
    }
    .splash-status {
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      letter-spacing: 0.3px;
      margin: 0;
    }
    @keyframes indeterminate {
      0% { left: -45%; width: 45%; }
      50% { left: 25%; width: 60%; }
      100% { left: 105%; width: 45%; }
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.9; }
    }
  </style>

  <script>
    (function () {
      function dismissSplash() {
        var s = document.getElementById('securgym-splash-screen');
        if (s && !s.classList.contains('fade-out')) {
          s.classList.add('fade-out');
          setTimeout(function () { if (s && s.parentNode) s.remove(); }, 400);
        }
      }
      var obs = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          dismissSplash();
          obs.disconnect();
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('flutter-first-frame', dismissSplash);
      setTimeout(dismissSplash, 15000);
    })();
  </script>
  <script>
    (function () {
      var BUILD_VERSION = "20261111_224708";
      window.__SECURGYM_BUILD_VERSION__ = BUILD_VERSION;
      var scriptLoaded = false;

      function clearSwAndCaches() {
        var p1 = ('serviceWorker' in navigator)
          ? navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));

          ? caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            }).catch(function () {})
          : Promise.resolve();
        return Promise.all([p1, p2]);
      }

      function injectBootstrap(ver) {
        if (scriptLoaded) return;
        scriptLoaded = true;
        var v = ver || BUILD_VERSION;
        window.__SECURGYM_BUILD_VERSION__ = v;
        var s = document.createElement('script');
        s.src = new URL('flutter_bootstrap.js?v=' + encodeURIComponent(v), document.baseURI).toString();
        s.async = true;
        document.body.appendChild(s);
      }

      function canReloadNow(ver) {
        try {
          var prev = sessionStorage.getItem('securgym_v_reload_ver');
          var at = Number(sessionStorage.getItem('securgym_v_reload_at') || '0');
          if (prev === ver && (Date.now() - at) < 15000) return false;
          sessionStorage.setItem('securgym_v_reload_ver', ver);
          sessionStorage.setItem('securgym_v_reload_at', String(Date.now()));
          return true;
        } catch (e) {
          return false;
        }
      }

      function hardReloadWithVersion(ver) {
        try {
          var u = new URL(window.location.href);
          u.searchParams.set('_v', ver);
          window.location.replace(u.toString());
        } catch (e) {
          window.location.reload();
        }
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
        }).catch(function () {});
      }

      try {
        var cur = new URL(window.location.href);
        if (cur.searchParams.has('_v')) {
          cur.searchParams.delete('_v');
          history.replaceState(null, '', cur.pathname + cur.search + cur.hash);
        }
      } catch (e) {}

      var ctrl = ('AbortController' in window) ? new AbortController() : null;
      var timer = setTimeout(function () {
        if (ctrl) { try { ctrl.abort(); } catch (e) {} }
        injectBootstrap(BUILD_VERSION);
      }, 1800);

      var versionUrl = new URL('version.json?_ts=' + Date.now(), document.baseURI).toString();
      fetch(versionUrl, {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' },
        signal: ctrl ? ctrl.signal : undefined
      })
        .then(function (r) { return r && r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (data) {
          clearTimeout(timer);
          var remoteVer = (data && data.version) ? String(data.version).trim() : BUILD_VERSION;
          var storedVer = null;
          try { storedVer = localStorage.getItem('securgym_build_version'); } catch (e) {}
          var needsCacheWipe = (storedVer !== remoteVer) || (remoteVer !== BUILD_VERSION);

          if (needsCacheWipe) {
            try { localStorage.setItem('securgym_build_version', remoteVer); } catch (e) {}
            clearSwAndCaches().then(function () {
              if ((remoteVer !== BUILD_VERSION || (storedVer && storedVer !== remoteVer)) && canReloadNow(remoteVer)) {
                hardReloadWithVersion(remoteVer);
                return;
              }
              injectBootstrap(remoteVer);
            });
          } else {
            injectBootstrap(remoteVer);
          }
        });
    })();
